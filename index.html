<!-- ============================== HTML START ============================== -->
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسہ دار القرآن والسنہ بیجاپور</title>

<!-- ============================== CSS START ============================== -->
<style>
/* ============================== CSS: فونٹس ============================== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Amiri:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

/* ============================== CSS: بنیادی سیٹنگ ============================== */
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;font-family:'Noto Nastaliq Urdu',serif}

/* ============================== CSS: ہیڈر باکس ============================== */
.madrasa-header{width:100%;margin:0 auto;background:linear-gradient(135deg,#e8f5ee,#fffdf5);text-align:center;padding:10px 12px 8px;border-bottom:3px solid #23734d;border-radius:0 0 18px 18px;box-shadow:0 4px 10px #173f2b20;color:#174c36}

/* ============================== CSS: مدرسے کا نام ============================== */
.madrasa-name{margin:-5px 0 2px;font-family:'Noto Nastaliq Urdu','Amiri',serif;font-size:clamp(23px,5vw,38px);font-weight:700;line-height:1.6}

/* ============================== CSS: رپورٹ کا عنوان ============================== */
.report-title{margin:6px 0 3px;font-family:'Noto Nastaliq Urdu','Amiri',serif;font-size:clamp(15px,3vw,23px);font-weight:700;color:#9a6b16;line-height:1.6}

/* ============================== CSS: انگریزی تفصیلات ============================== */
.madrasa-details{margin:4px 0;font-family:'Roboto',Arial,sans-serif;font-size:clamp(10px,2vw,13px);font-weight:500;line-height:1.7;direction:ltr;color:#43564b}

/* ============================== CSS: پرنٹ سیٹنگ ============================== */
@media print{
@page{size:A4 portrait;margin:10mm}
body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.madrasa-header{box-shadow:0 4px 10px #173f2b20;border-radius:0 0 18px 18px}
}




/* ============================== CSS: ماہ اور سال سلیکٹر START ============================== */
.report-period{width:calc(100% - 32px);max-width:1380px;margin:18px auto;padding:24px 28px 26px;background:#fff;border:1px solid #dce2ec;border-radius:28px;box-shadow:0 3px 12px #243b6408;color:#243b64;font-family:'Noto Nastaliq Urdu',serif}
.period-heading-row{display:flex;align-items:center;gap:18px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #e7e9ee}
.period-icon{width:66px;height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:center;background:#243f70;border-radius:16px;color:#fff}
.period-icon svg{width:36px;height:36px;display:block}
.period-heading-text{display:flex;flex-direction:column;gap:8px}
.period-title-urdu{margin:0;font-family:'Noto Nastaliq Urdu',serif;font-size:clamp(22px,2.8vw,32px);font-weight:700;line-height:1.8;color:#243b64}
.period-heading{margin:0;font-family:'Roboto',Arial,sans-serif;font-size:clamp(12px,1.5vw,18px);font-weight:700;letter-spacing:.3px;color:#7d8798;direction:ltr}
.period-fields{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:end}
.period-item{display:flex;flex-direction:column;align-items:stretch;gap:7px;min-width:0}
.period-label{font-family:'Noto Nastaliq Urdu',serif;font-size:clamp(15px,1.7vw,21px);font-weight:600;color:#46536a;white-space:nowrap;line-height:1.9}
.period-select{box-sizing:border-box;width:100%;min-width:0;height:76px;padding:10px 16px;border:1px solid #dce1eb;border-radius:19px;background:#f8f9fe;color:#243b64;font-family:'Noto Nastaliq Urdu',serif;font-size:clamp(17px,2vw,24px);font-weight:600;line-height:1.8;outline:none;cursor:pointer}
.period-select:focus{border-color:#4569a8;box-shadow:0 0 0 3px #4569a81a}
@media(max-width:600px){
.report-period{width:calc(100% - 24px);margin:14px auto;padding:18px 14px 20px;border-radius:22px}
.period-heading-row{gap:12px;margin-bottom:18px;padding-bottom:15px}
.period-icon{width:52px;height:52px;flex-basis:52px;border-radius:14px}
.period-icon svg{width:29px;height:29px}
.period-heading-text{gap:5px}
.period-title-urdu{font-size:clamp(20px,5vw,26px);line-height:1.9}
.period-heading{font-size:clamp(10px,2.7vw,13px);letter-spacing:0}
.period-fields{gap:12px}
.period-item{gap:6px}
.period-label{font-size:clamp(13px,3.5vw,16px)}
.period-select{height:64px;padding:8px 7px;border-radius:15px;font-size:clamp(14px,3.7vw,18px)}
}
@media(max-width:360px){
.report-period{padding:15px 10px}
.period-heading-row{gap:9px}
.period-icon{width:45px;height:45px;flex-basis:45px}
.period-icon svg{width:25px;height:25px}
.period-title-urdu{font-size:19px}
.period-heading{font-size:9px}
.period-fields{gap:9px}
.period-item{gap:5px}
.period-label{font-size:12px}
.period-select{height:58px;font-size:13px;padding:7px 4px}
}
/* ============================== CSS: ماہ اور سال سلیکٹر END ============================== */

  
</style>
<!-- ============================== CSS END ============================== -->
</head>

<body>
<!-- ============================== HTML: ہیڈر START ============================== -->
<header class="madrasa-header">
<h1 class="madrasa-name">مدرسہ دار القرآن والسنہ بیجاپور</h1>
<h2 class="report-title">ماہانہ تعلیمی پیش رفت رپورٹ</h2>
<p class="madrasa-details">SALAFIA ASSOCIATION · Kannat Masjid Complex, Near Badi Kaman, J.M. Road, BIJAPUR</p>
<p class="madrasa-details">ESTD: 1990 | Regd. No. 82/94-95</p>
</header>
<!-- ============================== HTML: ہیڈر END ============================== -->




<!-- ============================== HTML: ماہ اور سال سلیکٹر START ============================== -->
<section class="report-period">
<div class="period-heading-row">
<div class="period-icon" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="3" y="5" width="18" height="16" rx="2"/>
<path d="M16 3v4M8 3v4M3 10h18"/>
<path d="m9 15 2 2 4-4"/>
</svg>
</div>
<div class="period-heading-text">
<h3 class="period-title-urdu">رپورٹ کی مدت</h3>
<p class="period-heading">MONTHLY REPORT PERIOD</p>
</div>
</div>
<div class="period-fields">
<div class="period-item">
<label class="period-label" for="reportMonth">ماہِ رپورٹ</label>
<select class="period-select" id="reportMonth" required>
<option value="" selected disabled>مہینہ منتخب کریں</option>
<option value="1">جنوری</option>
<option value="2">فروری</option>
<option value="3">مارچ</option>
<option value="4">اپریل</option>
<option value="5">مئی</option>
<option value="6">جون</option>
<option value="7">جولائی</option>
<option value="8">اگست</option>
<option value="9">ستمبر</option>
<option value="10">اکتوبر</option>
<option value="11">نومبر</option>
<option value="12">دسمبر</option>
</select>
</div>
<div class="period-item">
<label class="period-label" for="reportYear">سنۂ رپورٹ</label>
<select class="period-select" id="reportYear" required>
<option value="" selected disabled>سال منتخب کریں</option>
</select>
</div>
</div>
</section>
<!-- ============================== HTML: ماہ اور سال سلیکٹر END ============================== -->

<!-- ============================== JAVASCRIPT START ============================== -->
<script>
/* ============================== JS: سال کے اختیارات START ============================== */
const yearSelect=document.getElementById('reportYear');
for(let year=2020;year<=2040;year++){
const option=document.createElement('option');
option.value=year;
option.textContent=year+'ء';
yearSelect.appendChild(option);
}
/* ============================== JS: سال کے اختیارات END ============================== */
/* ============================== JAVASCRIPT END ============================== */
</script>


</body>
</html>
<!-- ============================== HTML END ============================== -->
