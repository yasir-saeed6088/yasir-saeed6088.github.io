<!-- ============================== HTML START ============================== -->
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسہ دار القرآن والسنہ بیجاپور</title>

<!-- ============================== CSS START ============================== -->
<style>
/* ============================== CSS: فونٹس ============================== */
@import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Amiri:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

/* ============================== CSS: بنیادی سیٹنگ ============================== */
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;font-family:'Noto Nastaliq Urdu',serif}

/* ============================== CSS: ہیڈر باکس ============================== */
.madrasa-header{width:100%;margin:0 auto;background:linear-gradient(135deg,#e8f5ee,#fffdf5);text-align:center;padding:10px 12px 8px;border-bottom:3px solid #23734d;border-radius:0 0 18px 18px;box-shadow:0 4px 10px #173f2b20;color:#174c36}

/* ============================== CSS: مدرسے کا نام ============================== */
.madrasa-name{margin:-5px 0 2px;font-family:'Noto Nastaliq Urdu','Amiri',serif;font-size:clamp(23px,5vw,38px);font-weight:700;line-height:1.6}

/* ============================== CSS: رپورٹ کا عنوان ============================== */
.report-title{margin:6px 0 3px;font-family:'Noto Nastaliq Urdu','Amiri',serif;font-size:clamp(15px,3vw,23px);font-weight:700;color:#9a6b16;line-height:1.6}

/* ============================== CSS: انگریزی تفصیلات ============================== */
.madrasa-details{margin:4px 0;font-family:'Roboto',Arial,sans-serif;font-size:clamp(10px,2vw,13px);font-weight:500;line-height:1.7;direction:ltr;color:#43564b}

/* ============================== CSS: پرنٹ سیٹنگ ============================== */
@media print{
@page{size:A4 portrait;margin:10mm}
body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.madrasa-header{box-shadow:0 4px 10px #173f2b20;border-radius:0 0 18px 18px}
}



/* ============================== CSS: PRO MONTH-YEAR SELECTOR START ============================== */
.report-period{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin:16px auto;padding:10px 18px;width:fit-content;max-width:96%;background:linear-gradient(135deg,#fffdf6,#eaf4ed);border:1px solid #c4d8c8;border-top:3px solid #347653;border-radius:12px;box-shadow:0 4px 12px #173f2b15;color:#174c36;font-family:'Noto Nastaliq Urdu',serif}
.period-item{display:flex;align-items:center;gap:8px}
.period-label{font-family:'Noto Nastaliq Urdu',serif;font-size:14px;font-weight:700;color:#285d43}
.period-select{appearance:auto;min-width:112px;padding:7px 12px;border:1px solid #b8cdbd;border-radius:8px;background:#fff;color:#174c36;font-family:'Noto Nastaliq Urdu',serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 5px #173f2b0c;outline:none}
.period-select:focus{border-color:#347653;box-shadow:0 0 0 3px #34765320}
@media(max-width:420px){.report-period{gap:10px;padding:9px 12px}.period-item{gap:5px}.period-select{min-width:100px;font-size:12px}}
/* ============================== CSS: PRO MONTH-YEAR SELECTOR END ============================== */

</style>
<!-- ============================== CSS END ============================== -->
</head>

<body>
<!-- ============================== HTML: ہیڈر START ============================== -->
<header class="madrasa-header">
<h1 class="madrasa-name">مدرسہ دار القرآن والسنہ بیجاپور</h1>
<h2 class="report-title">ماہانہ تعلیمی پیش رفت رپورٹ</h2>
<p class="madrasa-details">SALAFIA ASSOCIATION · Kannat Masjid Complex, Near Badi Kaman, J.M. Road, BIJAPUR</p>
<p class="madrasa-details">ESTD: 1990 | Regd. No. 82/94-95</p>
</header>
<!-- ============================== HTML: ہیڈر END ============================== -->



<!-- ============================== HTML: ماہ اور سال سلیکٹر START ============================== -->
<section class="report-period">
<div class="period-item">
<label class="period-label" for="reportMonth">ماہِ رپورٹ</label>
<select class="period-select" id="reportMonth">
<option value="1">جنوری</option>
<option value="2">فروری</option>
<option value="3">مارچ</option>
<option value="4">اپریل</option>
<option value="5">مئی</option>
<option value="6">جون</option>
<option value="7">جولائی</option>
<option value="8">اگست</option>
<option value="9">ستمبر</option>
<option value="10" selected>اکتوبر</option>
<option value="11">نومبر</option>
<option value="12">دسمبر</option>
</select>
</div>
<div class="period-item">
<label class="period-label" for="reportYear">سنۂ رپورٹ</label>
<select class="period-select" id="reportYear"></select>
</div>
</section>
<!-- ============================== HTML: ماہ اور سال سلیکٹر END ============================== -->

<!-- ============================== JAVASCRIPT START ============================== -->
<script>
const yearSelect=document.getElementById('reportYear');
for(let year=2020;year<=2040;year++){
const option=document.createElement('option');
option.value=year;
option.textContent=year+'ء';
if(year===2026)option.selected=true;
yearSelect.appendChild(option);
}
</script>
<!-- ============================== JAVASCRIPT END ============================== -->


</body>
</html>
<!-- ============================== HTML END ============================== -->
